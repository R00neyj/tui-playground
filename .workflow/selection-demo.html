<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>트리맵 선택 색 후보</title>
<style>
  body { margin: 0; background: #14161a; color: #d8dbe0; font: 15px/1.55 system-ui, "Malgun Gothic", sans-serif; }
  header { padding: 20px 32px 8px; } h1 { margin: 0 0 6px; font-size: 20px; } p { margin: 0; color: #9aa1ad; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; padding: 18px 32px 40px; }
  figure { margin: 0; background: #0c0c0c; border: 1px solid #2a2e36; border-radius: 10px; overflow: hidden; width: 520px; }
  figcaption { padding: 10px 14px 12px; border-top: 1px solid #2a2e36; background: #181b20; }
  figcaption b { display: inline-block; min-width: 1.6em; padding: 0 7px; margin-right: 8px; border-radius: 5px; background: #3a7bd5; color: #fff; text-align: center; }
  figcaption span { color: #9aa1ad; font-size: 13px; display: block; margin-top: 3px; }
  .map { display: grid; grid-template-columns: 5fr 3fr 2fr; grid-template-rows: 70px 70px 70px; gap: 0; font: 13px/18px "Cascadia Mono", "D2Coding", Consolas, "Malgun Gothic", monospace; margin: 14px; color: #0c0c0c; }
  .map div { padding: 2px 8px; overflow: hidden; }
  .r1 { grid-row: 1 / 3; background: rgb(59,120,255); } .r2 { grid-column: 2 / 4; background: rgb(22,198,12); }
  .r3 { background: rgb(97,214,214); } .r4 { background: rgb(249,241,165); } .r5 { grid-column: 1 / 3; background: rgb(180,0,158); } .r6 { background: rgb(58,150,221); }
  /* 선택 후보 */
  .s1 .r3 { background: rgb(118,118,118); color: #f2f2f2; font-weight: bold; }
  .s2 .r3 { background: rgb(0,55,218); color: #f2f2f2; font-weight: bold; }
  .s3 .r3 { background: rgb(204,204,204); color: #0c0c0c; font-weight: bold; }
  .s4 .r3 { font-weight: bold; box-shadow: inset 0 0 0 3px #f2f2f2; }
  .s5 .r3 { background: repeating-linear-gradient(135deg, rgb(97,214,214) 0 6px, rgb(40,120,130) 6px 12px); font-weight: bold; }
</style>
</head>
<body>
<header><h1>트리맵 선택 칸 색 후보</h1><p>같은 트리맵에서 가운데 위의 청록 칸이 "선택된" 칸임. 나머지 칸은 선택 안 된 원래 색임. 글자 `▸` 표시는 모두 붙음.</p></header>
<div class="row">
<figure><div class="map s1"><div class="r1">Videos/<br>48.2 GB</div><div class="r2">Documents/<br>12.4 GB</div><div class="r3">▸ Music/<br>9.1 GB</div><div class="r4">Pictures/</div><div class="r5">AppData/ 31.0 GB</div><div class="r6">기타 (24개)</div></div><figcaption><b>1</b>어두운 회색 + 흰 굵은 글자<span>ANSI 8번 바탕. 눈부심 없음. 다만 "비활성"처럼 보일 수 있음</span></figcaption></figure>
<figure><div class="map s2"><div class="r1">Videos/<br>48.2 GB</div><div class="r2">Documents/<br>12.4 GB</div><div class="r3">▸ Music/<br>9.1 GB</div><div class="r4">Pictures/</div><div class="r5">AppData/ 31.0 GB</div><div class="r6">기타 (24개)</div></div><figcaption><b>2</b>짙은 파랑 + 흰 굵은 글자<span>ANSI 4번 바탕. 선택 표시로 흔한 색이고 팔레트의 파랑(12번)과 구분됨</span></figcaption></figure>
<figure><div class="map s3"><div class="r1">Videos/<br>48.2 GB</div><div class="r2">Documents/<br>12.4 GB</div><div class="r3">▸ Music/<br>9.1 GB</div><div class="r4">Pictures/</div><div class="r5">AppData/ 31.0 GB</div><div class="r6">기타 (24개)</div></div><figcaption><b>3</b>연한 회색 + 검정 굵은 글자<span>ANSI 7번 바탕. 흰색보다 덜 밝지만 여전히 밝은 면임</span></figcaption></figure>
<figure><div class="map s4"><div class="r1">Videos/<br>48.2 GB</div><div class="r2">Documents/<br>12.4 GB</div><div class="r3">▸ Music/<br>9.1 GB</div><div class="r4">Pictures/</div><div class="r5">AppData/ 31.0 GB</div><div class="r6">기타 (24개)</div></div><figcaption><b>4</b>원래 색 유지 + 흰 테두리 한 겹<span>면은 그대로 두고 가장자리만 얇은 선으로 표시. 가장 덜 눈부심. 칸 가장자리에 선 문자를 그려야 해서 좁은 칸에서는 선이 글자를 먹을 수 있음</span></figcaption></figure>
<figure><div class="map s5"><div class="r1">Videos/<br>48.2 GB</div><div class="r2">Documents/<br>12.4 GB</div><div class="r3">▸ Music/<br>9.1 GB</div><div class="r4">Pictures/</div><div class="r5">AppData/ 31.0 GB</div><div class="r6">기타 (24개)</div></div><figcaption><b>5</b>원래 색 + 빗금 무늬<span>`▒`·`░` 문자를 섞어 무늬로 표시. 색이 아닌 질감으로 구분함. 글자가 읽기 어려워질 수 있음</span></figcaption></figure>
</div>
</body>
</html>
